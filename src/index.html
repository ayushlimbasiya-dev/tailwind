<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Railway Hero</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
</head>

<body class="bg-[#13111c] font-['Inter']">

  <!-- NAVBAR -->
  <header class="relative flex h-[86px] items-center justify-between border-b border-white/10 bg-[#13111c] px-7 text-[18px] font-medium text-white">
    <!-- Logo -->
    <a href="#" class="text-[28px] font-semibold">Railway</a>
    <nav class="hidden gap-10 text-[#e9e7f2] lg:flex">
      <a href="#">Product</a>
      <a href="#">Developers</a>
      <a href="#">Enterprise</a>
      <a href="#">Company</a>
      <a href="#">Pricing</a>
    </nav>

    <!-- right side-->
    <div class="hidden gap-10 lg:flex">
      <a href="#">Sign in</a>
      <a href="#">Book a demo</a>
    </div>

    <!-- ICON -->
    <button id="menuBtn" class="lg:hidden" aria-label="Menu">
      <svg class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div id="mobileMenu" class="absolute right-4 top-[90px] z-10 hidden w-64 flex-col gap-3 rounded-lg border border-white/10 bg-[#1c1a28] p-4 lg:hidden">
      <a href="#" class="px-2 py-1">Product</a>
      <a href="#" class="px-2 py-1">Developers</a>
      <a href="#" class="px-2 py-1">Enterprise</a>
      <a href="#" class="px-2 py-1">Company</a>
      <a href="#" class="px-2 py-1">Pricing</a>

      <!-- Alag buttons -->
      <a href="#" class="rounded-lg border border-white/15 py-2 text-center hover:bg-white/10">Sign in</a>
      <a href="#" class="rounded-lg bg-[#563f86] py-2 text-center hover:bg-[#654c9c]">Book a demo</a>
    </div>
  </header>

  <!-- HERO -->
  <section class="flex min-h-[520px] flex-col items-center bg-[#1c2833] px-6 pt-[150px] text-center text-white">
    <h1 class="font-['Newsreader'] text-5xl font-medium md:text-[60px]">Ship software peacefully</h1>
    <p class="mt-9 font-['Newsreader'] text-xl text-[#d6d9e6] md:text-[27px]">
      With the all-in-one <u class="underline-offset-4">intelligent</u> cloud provider
    </p>
    <div class="mt-12 flex gap-4 text-[21px] font-medium">
      <a href="#" class="flex h-[72px] w-[172px] items-center justify-center rounded-lg border border-[#7a64b0]/60 bg-[#563f86] hover:bg-[#654c9c]">
        Deploy →
      </a>
      <a href="#" class="flex h-[72px] w-[144px] items-center justify-center rounded-lg border border-white/15 bg-[#10181f] hover:bg-[#18222b]">
        Agents
      </a>
    </div>
  </section>

  <script>
    const btn = document.getElementById("menuBtn");
    const menu = document.getElementById("mobileMenu");
    btn.addEventListener("click", () => {
      menu.classList.toggle("hidden");
      menu.classList.toggle("flex");
    });
  </script>
</body>
</html>
